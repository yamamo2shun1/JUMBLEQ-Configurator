name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm test

      - name: Restore Deploy Now credentials
        env:
          LOLIPOP_CREDENTIALS_BASE64: ${{ secrets.LOLIPOP_CREDENTIALS_BASE64 }}
        run: |
          if [ -z "$LOLIPOP_CREDENTIALS_BASE64" ]; then
            echo "Repository secret LOLIPOP_CREDENTIALS_BASE64 is not configured." >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/lolipop"
          printf '%s' "$LOLIPOP_CREDENTIALS_BASE64" | base64 --decode > "$HOME/.config/lolipop/credentials.json"
          chmod 600 "$HOME/.config/lolipop/credentials.json"

      - name: Deploy to LOLIPOP! Deploy Now
        run: npx --yes lolipop@2.0.6 deploy --project 01M0D4QW24D2WY8JB2HB95RDA7 --dir . --json
